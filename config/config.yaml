# Generic Configuration for PM.py

n_detections: 5 # Minimum number of detections required to fit a proper motion

mjd_ref: 57388.0 # Reference MJD for the data in days

# ra0: 15.1083 # RA of the reference point in degrees
# dec0: -33.7186 # Dec of the reference point in degrees

cores: 32 # Number of CPU cores to use for parallel processing
chunksize: 1000 # Size of chunks for parallel processing

n_modests: 3 # Number of modest proper motion iterations to perform

modest:
  linklength: 0.5 # Maximum link length in arcseconds
  min_dt: 0.8 # Minimum time difference in years
  eps: 5.0 # DBSCAN epsilon value
  min_pairs: 4 # Minimum number of pairs to consider a group
  shared_pairs: 0.51 # Maximum fraction of shared pairs to consider a group
  large_group_size: 100 # Groups with >= this many detections are fit in a separate, less-parallel pass
  large_group_cores_divisor: 1 # cores // this value = worker count for the large-group pass. Lower (e.g. 4) trades core usage for a smaller peak-memory spike: each worker's DBSCAN matrix is ~8*(n*(n-1)/2)^2 bytes for an n-detection group (~1.5GB at n=166), so cores_divisor=1 x cores concurrent large groups can spike to cores x that. Raise the divisor again if a healpixel has denser large groups than hp11002 (max ~150) and OOMs.

pm_lim: 5000 # Maximum proper motion in mas/yr for removal
pm_err_lim: 50 # Maximum proper motion error in mas/yr for removal

fast:
  pair_batch_size: 200000 # Query points per batch when streaming candidate pairs (memory vs. speed)
  pairlength: 60.0 # Maximum pair length in arcseconds
  eps_pad: 2.0 # Safety margin (in multiples of eps) for the whitened 4D linking search radius
  min_pairs: 4 # Minimum number of pairs to consider a group
  min_sep: 0.05 # Minimum separation in arcseconds
  max_sep: 20.0 # Maximum separation in arcseconds
  eps: 2.0 # DBSCAN epsilon value
  min_dt: 0.8 # Minimum time difference in years
  shared_pairs: 0.51 # Maximum fraction of shared pairs to consider a group
  season_sample_frac: 1.0 # Randomly keep this fraction of detections per season before pairing (1.0 = disabled). Lower (e.g. 0.3) for healpixels where dense multi-epoch coverage blows up pair counts. Acts as an upper bound when pair_budget is also set.
  season_gap: 0.25 # Time gap (years) that starts a new season for season_sample_frac
  season_sample_seed: null # RNG seed for season_sample_frac subsampling; null = nondeterministic
  pair_budget: null # Target raw pairlength-pair count; if set, season_sample_frac is auto-lowered on the fly to land near this budget. e.g. 20000000. The frac actually used is recorded in the output FITS header (season_sample_frac_used, season_raw_pairs_est).

fastcheck:
  search_radius: 1.0 # Search radius in arcseconds
  slow_pm_threshold: 50 # Proper motion threshold in mas/yr to consider a source as slow
  pairlength: 60.0 # Maximum pair length in arcseconds
  linklength: 2.0 # Maximum link length in arcseconds
  min_pairs: 4 # Minimum number of pairs to consider a group
  min_sep: 0.01 # Minimum separation in arcseconds
  max_sep: 20.0 # Maximum separation in arcseconds
  eps: 5.0 # DBSCAN epsilon value
  min_dt: 1.6 # Minimum time difference in years
  shared_pairs: 0.51 # Maximum fraction of shared pairs to consider a group

static_check:
  linklength: 0.5 # Maximum link length in arcseconds
  time_sep: 2. # Minimum time separation in years
  sub_n: 3 # Number of detections to consider for static check

min_overlap: 0.79

fitting:
  time_sep: 1.5 # Minimum time separation in years
  minSeasons: 3 # Minimum number of distinct seasons with detections
  t_season: 0.25 # Minimum time separation to consider a new season in years
  chisqClip: 11.0 # Per-point chi-squared (2 dof) clipping threshold
  reducedChisqMax: 3.0 # Max accepted reduced chi-squared (chisqTotal/dof) for overall fit
  parallax_prior: 0.15 # Parallax prior in "
  color_prior: 3.0 # Color prior in mag
  colorFrac: 0.9 # Required color fraction to use coadd color
  pm_prior: null # Proper motion prior in "/yr

output_name: null # Name of the output file, if null, will be generated based on input data

